# Runs the test suite on every push to main and on every pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege token: the workflow only reads the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The app is Windows-only (PySide6 UI, Windows paths), so the tests run on Windows.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same Python as the development environment and requirements.lock.txt.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.lock.txt

      # The runner image ships PostgreSQL, but its service is disabled. Start it,
      # wait until it accepts connections, then create the test role and database.
      - name: Start PostgreSQL and create test database
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $pg = Get-CimInstance win32_service -Filter "Name LIKE 'postgresql%'" | Select-Object -First 1
          Set-Service $pg.Name -StartupType Manual
          Start-Service $pg.Name

          # Superuser password of the runner image (CI-only).
          $env:PGPASSWORD = 'root'
          for ($i = 0; $i -lt 30; $i++) {
            & "$env:PGBIN\pg_isready.exe" -h localhost -p 5432 -q
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL did not start' }

          # From here on a failed psql call must stop the step.
          $PSNativeCommandUseErrorActionPreference = $true

          # Throwaway CI-only credentials; they exist only on this runner.
          & "$env:PGBIN\psql.exe" -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE journal_user LOGIN PASSWORD 'ci_password_only';"
          # UTF8 explicitly: Cyrillic test data must not depend on the runner's default encoding.
          & "$env:PGBIN\psql.exe" -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE journal_test OWNER journal_user ENCODING 'UTF8' TEMPLATE template0;"

      - name: Run tests
        shell: pwsh
        env:
          # The app database is not created in CI; tests use only journal_test.
          DATABASE_URL: postgresql+psycopg://journal_user:ci_password_only@localhost:5432/journal
          TEST_DATABASE_URL: postgresql+psycopg://journal_user:ci_password_only@localhost:5432/journal_test
          # In case any test imports the UI.
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
